name: Bug Report
description: Report a bug or issue with the Plugin
labels: ["Bug"]
type: bug

body:
  - type: markdown
    attributes:
      value: "Before creating a Bug Report, please update the Plugin first, and check issues if the Bug has already been reported."
  
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: I.e. 2.0
      description: What version of the Plugin are you using?
  
  - type: input
    id: adonis_version
    attributes:
      label: Adonis version
      placeholder: I.e. 285
      description: What version of Adonis are you using? You can find it under Adonis_Loader > Version > .Value
  
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Please describe what exactly happened
      placeholder: Describe what happened here...
    validations:
      required: true
  
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the bug you have found.
      placeholder: List the steps here!
    validations:
      required: true